<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTI Hub background</title>

<style>
html {
  background: #040817;
}

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}

#bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  display: block;
}
</style>
</head>

<body>

<canvas id="bg" aria-hidden="true"></canvas>

<script>
(() => {
  const cv = document.getElementById('bg');
  const x = cv.getContext('2d');

  const reduce =
    matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, D, cx, cy, R;
  let mx = 0,
      my = 0,
      tx = 0,
      ty = 0;

  let halo, rim;

  const SPIN = 0.00006;
  const TILT = 0.42;
  const DOTS = 3200;

  const PLANET_X = 0.64;
  const PLANET_Y = 0.46;
  const PLANET_SIZE = 0.34;

  const rnd = (a, b) =>
    a + Math.random() * (b - a);

  const TAU = Math.PI * 2;

  const MAP = [
    [[8,18],[22,30],[50,58]],
    [[6,20],[22,32],[44,70]],
    [[3,20],[24,31],[38,71]],
    [[2,22],[25,30],[35,71]],
    [[3,24],[26,29],[33,71]],
    [[4,24],[33,71]],
    [[5,24],[34,70]],
    [[7,23],[34,52],[53,68]],
    [[9,23],[34,47],[49,69]],
    [[10,22],[33,46],[47,69]],
    [[11,21],[32,45],[46,55],[59,66]],
    [[12,20],[32,46],[47,54],[56,65]],
    [[13,19],[32,46],[48,53],[57,62]],
    [[15,18],[32,45],[49,52],[58,62]],
    [[18,22],[33,45],[50,52],[58,61]],
    [[19,27],[34,44],[57,60],[62,66]],
    [[20,29],[36,44],[57,66]],
    [[19,28],[37,45],[58,68]],
    [[19,28],[38,45],[57,66]],
    [[20,28],[38,45],[61,67]],
    [[20,27],[38,44],[59,67]],
    [[20,26],[38,44],[58,67]],
    [[21,26],[38,43],[58,68]],
    [[21,25],[39,42],[59,68],[69,70]],
    [[21,24],[64,68]],
    [[21,24],[68,71]],
    [[21,23]],
    [[22,23]],
    []
  ];

  const isLand = (lat, lon) => {
    const r = Math.round((80 - lat) / 5);

    if (r < 0 || r >= MAP.length) {
      return false;
    }

    const c = Math.floor((lon + 180) / 5);

    return MAP[r].some(
      ([a, b]) => c >= a && c <= b
    );
  };

  const vec = (lat, lon) => {
    lat *= Math.PI / 180;
    lon *= Math.PI / 180;

    return [
      Math.cos(lat) * Math.sin(lon),
      Math.sin(lat),
      Math.cos(lat) * Math.cos(lon)
    ];
  };

  const pts = Array.from(
    { length: DOTS },
    (_, i) => {
      const y =
        1 - (2 * (i + 0.5)) / DOTS;

      const r =
        Math.sqrt(1 - y * y);

      const th =
        i * 2.399963;

      const v = [
        Math.sin(th) * r,
        y,
        Math.cos(th) * r
      ];

      const land = isLand(
        Math.asin(y) * 180 / Math.PI,
        Math.atan2(v[0], v[2]) *
          180 /
          Math.PI
      );

      return {
        v,
        land,
        city:
          land &&
          Math.random() < 0.1
      };
    }
  );

  const nodes = [
    [40,-74],
    [51,0],
    [28,77],
    [1,103],
    [35,139],
    [-33,151],
    [-23,-46],
    [30,31],
    [55,37],
    [37,-122],
    [-1,37],
    [19,73]
  ].map(([a,b]) => vec(a,b));

  const links = [
    [0,1],
    [1,2],
    [2,3],
    [3,4],
    [4,5],
    [0,6],
    [1,7],
    [7,2],
    [8,4],
    [9,0],
    [6,10],
    [10,7],
    [2,11],
    [11,3],
    [9,4]
  ];

  const arcCols = [
    '255,110,90',
    '110,170,255',
    '255,150,80',
    '150,120,255'
  ];

  const arcs = links.map(
    ([a,b], k) => {
      const A = nodes[a];
      const B = nodes[b];

      const om = Math.acos(
        Math.min(
          1,
          A[0] * B[0] +
          A[1] * B[1] +
          A[2] * B[2]
        )
      );

      const s = Math.sin(om);
      const line = [];

      for (
        let j = 0;
        j <= 36;
        j++
      ) {
        const u = j / 36;

        const f1 =
          Math.sin(
            (1 - u) * om
          ) / s;

        const f2 =
          Math.sin(u * om) / s;

        const lift =
          1.01 +
          0.3 *
          om /
          3.14 *
          Math.sin(
            Math.PI * u
          );

        line.push([
          (A[0] * f1 +
            B[0] * f2) *
            lift,

          (A[1] * f1 +
            B[1] * f2) *
            lift,

          (A[2] * f1 +
            B[2] * f2) *
            lift
        ]);
      }

      return {
        line,
        off: k * 0.29,
        sp: rnd(
          0.00014,
          0.00026
        ),
        col:
          arcCols[k % 4]
      };
    }
  );

  const rings = [
    {
      ro: 1.5,
      tx: 1.22,
      tz: 0.5,
      sp: 0.0003,
      n: 2,
      c: '255,100,120'
    },
    {
      ro: 1.72,
      tx: 1.0,
      tz: -0.45,
      sp: -0.00022,
      n: 2,
      c: '110,170,255'
    },
    {
      ro: 2.0,
      tx: 1.35,
      tz: 0.1,
      sp: 0.00016,
      n: 2,
      c: '160,120,255'
    }
  ];

  const stars =
    Array.from(
      { length: 260 },
      () => ({
        x: Math.random(),
        y: Math.random(),
        r: rnd(0.3,1.2),
        p: rnd(0,TAU),
        s: rnd(0.4,1.6)
      })
    );

  const embers =
    Array.from(
      { length: 60 },
      () => ({
        x: Math.random(),
        y: Math.random(),
        r: rnd(1,3),
        vx: rnd(
          -0.00001,
          0.00001
        ),
        vy: rnd(
          -0.00003,
          -0.00001
        ),
        c: [
          '110,180,255',
          '160,120,255',
          '255,130,100'
        ][
          (Math.random() * 3) | 0
        ],
        p: rnd(0,TAU)
      })
    );

  const net =
    Array.from(
      { length: 46 },
      () => ({
        a: rnd(0,TAU),
        d: rnd(1.15,2.7),
        sp:
          rnd(
            -0.00006,
            0.00006
          ) *
          (
            Math.random() < 0.5
              ? 1
              : -1
          ),
        ph: rnd(0,TAU),
        wob: rnd(0.02,0.08)
      })
    );

  const icons = [
    {
      t:'alert',
      ox:-0.42,
      oy:-0.42,
      s:30,
      ph:0
    },
    {
      t:'shield',
      ox:1.7,
      oy:-0.75,
      s:26,
      ph:2
    },
    {
      t:'lock',
      ox:-1.0,
      oy:-0.25,
      s:13,
      ph:1
    },
    {
      t:'lock',
      ox:-0.85,
      oy:0.38,
      s:12,
      ph:3
    },
    {
      t:'lock',
      ox:0.35,
      oy:0.22,
      s:11,
      ph:4
    }
  ];

  const rot = (v,a) => {
    const ca = Math.cos(a);
    const sa = Math.sin(a);

    const ct = Math.cos(TILT);
    const st = Math.sin(TILT);

    const x1 =
      v[0] * ca +
      v[2] * sa;

    const z1 =
      -v[0] * sa +
      v[2] * ca;

    return [
      x1,
      v[1] * ct -
        z1 * st,
      v[1] * st +
        z1 * ct
    ];
  };

  const P = (
    p,
    k = 1
  ) => [
    cx + p[0] * R * k,
    cy - p[1] * R * k
  ];

  const glow = (
    px,
    py,
    r,
    c,
    a
  ) => {
    const g =
      x.createRadialGradient(
        px,
        py,
        0,
        px,
        py,
        r
      );

    g.addColorStop(
      0,
      `rgba(${c},${a})`
    );

    g.addColorStop(
      1,
      `rgba(${c},0)`
    );

    x.fillStyle = g;

    x.fillRect(
      px-r,
      py-r,
      r*2,
      r*2
    );
  };

  const ringPt = (
    rg,
    ph
  ) => {
    const X =
      Math.cos(ph) *
      rg.ro;

    const Z =
      Math.sin(ph) *
      rg.ro;

    const y1 =
      -Z *
      Math.sin(rg.tx);

    const z1 =
      Z *
      Math.cos(rg.tx);

    return [
      X * Math.cos(rg.tz) -
        y1 *
        Math.sin(rg.tz),

      X * Math.sin(rg.tz) +
        y1 *
        Math.cos(rg.tz),

      z1
    ];
  };

  function makeLayer() {
    const c =
      document.createElement(
        'canvas'
      );

    c.width =
      W * D;

    c.height =
      H * D;

    const g =
      c.getContext('2d');

    g.setTransform(
      D,
      0,
      0,
      D,
      0,
      0
    );

    return [c,g];
  }

  function build() {
    let g;

    [halo,g] =
      makeLayer();

    g.globalCompositeOperation =
      'lighter';

    let gr =
      g.createRadialGradient(
        cx,
        cy,
        R * 0.9,
        cx,
        cy,
        R * 1.7
      );

    gr.addColorStop(
      0,
      'rgba(70,120,255,.6)'
    );

    gr.addColorStop(
      0.3,
      'rgba(90,80,240,.22)'
    );

    gr.addColorStop(
      1,
      'rgba(70,50,220,0)'
    );

    g.fillStyle = gr;

    g.beginPath();

    g.arc(
      cx,
      cy,
      R * 1.7,
      0,
      TAU
    );

    g.fill();

    gr =
      g.createRadialGradient(
        cx-R*1.3,
        cy+R*0.3,
        0,
        cx-R*1.3,
        cy+R*0.3,
        R*1.5
      );

    gr.addColorStop(
      0,
      'rgba(255,90,90,.16)'
    );

    gr.addColorStop(
      1,
      'rgba(255,90,90,0)'
    );

    g.fillStyle = gr;

    g.fillRect(
      0,
      0,
      W,
      H
    );

    [rim,g] =
      makeLayer();

    gr =
      g.createRadialGradient(
        cx-R*0.6,
        cy+R*0.55,
        R*0.2,
        cx-R*0.6,
        cy+R*0.55,
        R*1.7
      );

    gr.addColorStop(
      0,
      'rgba(2,4,20,.42)'
    );

    gr.addColorStop(
      1,
      'rgba(2,4,20,0)'
    );

    g.save();

    g.beginPath();

    g.arc(
      cx,
      cy,
      R,
      0,
      TAU
    );

    g.clip();

    g.fillStyle = gr;

    g.fillRect(
      cx-R,
      cy-R,
      R*2,
      R*2
    );

    g.restore();

    gr =
      g.createRadialGradient(
        cx,
        cy,
        R*0.72,
        cx,
        cy,
        R
      );

    gr.addColorStop(
      0,
      'rgba(90,150,255,0)'
    );

    gr.addColorStop(
      1,
      'rgba(110,170,255,.5)'
    );

    g.fillStyle = gr;

    g.beginPath();

    g.arc(
      cx,
      cy,
      R,
      0,
      TAU
    );

    g.fill();

    g.lineWidth = 3;
    g.lineCap = 'round';

    for (
      let i=0;
      i<180;
      i++
    ) {
      const a0 =
        i/180*TAU;

      const t =
        Math.pow(
          (
            1 +
            Math.cos(
              a0-2.36
            )
          )/2,
          1.6
        );

      const c = [
        0,
        1,
        2
      ].map(
        k =>
          Math.round(
            [130,205,255][k] *
              (1-t) +
            [255,110,100][k] *
              t
          )
      );

      g.strokeStyle =
        `rgba(${c},.85)`;

      g.shadowColor =
        `rgba(${c},1)`;

      g.shadowBlur = 22;

      g.beginPath();

      g.arc(
        cx,
        cy,
        R,
        a0,
        a0 +
          TAU/180 +
          0.02
      );

      g.stroke();
    }
  }

  function drawRing(
    rg,
    t,
    front
  ) {
    x.lineWidth = 1;

    x.strokeStyle =
      `rgba(${rg.c},${
        front ? .55 : .18
      })`;

    x.beginPath();

    for (
      let i=0;
      i<120;
      i++
    ) {
      const a =
        ringPt(
          rg,
          i/120*TAU
        );

      const b =
        ringPt(
          rg,
          (i+1)/120*TAU
        );

      if (
        (a[2]+b[2]>0) ===
        front
      ) {
        const [
          x0,y0
        ] = P(a);

        const [
          x1,y1
        ] = P(b);

        x.moveTo(
          x0,
          y0
        );

        x.lineTo(
          x1,
          y1
        );
      }
    }

    x.stroke();

    for (
      let k=0;
      k<rg.n;
      k++
    ) {
      for (
        let s=0;
        s<8;
        s++
      ) {
        const p =
          ringPt(
            rg,
            t*rg.sp +
              k*TAU/rg.n -
              s*0.035*
              Math.sign(
                rg.sp
              )
          );

        if (
          (p[2]>0) !==
          front
        ) {
          continue;
        }

        const [
          px,py
        ] = P(p);

        glow(
          px,
          py,
          (s ? 9 : 17) *
            (1-s/10),
          rg.c,
          (s ? .35 : .95) *
            (1-s/8)
        );
      }
    }
  }

  function drawIcon(
    ic,
    t
  ) {
    const b =
      Math.sin(
        t*0.0012 +
        ic.ph
      );

    const px =
      cx +
      ic.ox*R +
      Math.sin(
        t*0.0008 +
        ic.ph
      )*4;

    const py =
      cy +
      ic.oy*R +
      b*6;

    const s =
      ic.s;

    x.save();

    x.translate(
      px,
      py
    );

    x.lineJoin =
      'round';

    x.lineCap =
      'round';

    const col =
      ic.t === 'alert'
        ? '255,80,90'
        : '90,170,255';

    x.globalCompositeOperation =
      'lighter';

    glow(
      0,
      0,
      s*2.4,
      col,
      .55
    );

    x.globalCompositeOperation =
      'source-over';

    if (
      ic.t === 'alert'
    ) {
      x.fillStyle =
        'rgba(210,40,60,.85)';

      x.beginPath();

      x.arc(
        0,
        0,
        s,
        0,
        TAU
      );

      x.fill();

      x.strokeStyle =
        'rgba(255,150,150,.9)';

      x.lineWidth =
        1.5;

      x.stroke();

      x.strokeStyle =
        '#fff';

      x.lineWidth =
        2.4;

      x.beginPath();

      x.moveTo(
        0,
        -s*.5
      );

      x.lineTo(
        s*.5,
        s*.38
      );

      x.lineTo(
        -s*.5,
        s*.38
      );

      x.closePath();

      x.stroke();

      x.beginPath();

      x.moveTo(
        0,
        -s*.12
      );

      x.lineTo(
        0,
        s*.12
      );

      x.moveTo(
        0,
        s*.26
      );

      x.lineTo(
        0,
        s*.27
      );

      x.stroke();

    } else if (
      ic.t === 'shield'
    ) {

      x.fillStyle =
        'rgba(20,50,140,.7)';

      x.strokeStyle =
        'rgba(120,190,255,.9)';

      x.lineWidth =
        1.5;

      x.beginPath();

      x.roundRect(
        -s,
        -s,
        s*2,
        s*2,
        s*.35
      );

      x.fill();
      x.stroke();

      x.strokeStyle =
        '#7fd0ff';

      x.lineWidth =
        2.2;

      x.beginPath();

      x.moveTo(
        0,
        -s*.55
      );

      x.lineTo(
        s*.5,
        -s*.3
      );

      x.lineTo(
        s*.42,
        s*.18
      );

      x.quadraticCurveTo(
        s*.3,
        s*.5,
        0,
        s*.62
      );

      x.quadraticCurveTo(
        -s*.3,
        s*.5,
        -s*.42,
        s*.18
      );

      x.lineTo(
        -s*.5,
        -s*.3
      );

      x.closePath();

      x.stroke();

    } else {

      x.strokeStyle =
        'rgba(140,200,255,.95)';

      x.fillStyle =
        'rgba(40,90,220,.75)';

      x.lineWidth =
        1.6;

      x.beginPath();

      x.arc(
        0,
        -s*.2,
        s*.5,
        Math.PI,
        0
      );

      x.stroke();

      x.beginPath();

      x.roundRect(
        -s*.7,
        -s*.2,
        s*1.4,
        s,
        3
      );

      x.fill();
      x.stroke();
    }

    x.restore();
  }

  function frame(t) {
    x.fillStyle =
      '#040817';

    x.fillRect(
      0,
      0,
      W,
      H
    );

    x.globalCompositeOperation =
      'lighter';

    glow(
      cx,
      cy,
      R*3.6,
      '40,60,170',
      .3
    );

    glow(
      W*.12,
      H*.95,
      R*2.4,
      '120,50,210',
      .2
    );

    glow(
      W*.95,
      H*.1,
      R*1.6,
      '60,90,220',
      .12
    );

    for (
      const s of stars
    ) {
      x.fillStyle =
        `rgba(190,210,255,${
          .3 +
          .35 *
          Math.sin(
            t*.001*s.s +
            s.p
          )
        })`;

      x.beginPath();

      x.arc(
        s.x*W,
        s.y*H,
        s.r,
        0,
        TAU
      );

      x.fill();
    }

    for (
      const e of embers
    ) {
      if (!reduce) {
        e.x += e.vx*16;
        e.y += e.vy*16;

        if (
          e.y < -.02
        ) {
          e.y = 1.02;
          e.x =
            Math.random();
        }

        if (
          e.x < -.02
        )
          e.x = 1.02;

        if (
          e.x > 1.02
        )
          e.x = -.02;
      }

      glow(
        e.x*W,
        e.y*H,
        e.r*6,
        e.c,
        .28 +
        .22 *
        Math.sin(
          t*.0015 +
          e.p
        )
      );
    }

    x.lineWidth = 1;

    for (
      let k=0;
      k<6;
      k++
    ) {
      const lg =
        x.createLinearGradient(
          0,
          0,
          W*.5,
          0
        );

      lg.addColorStop(
        0,
        `rgba(${
          k%2
            ? '150,90,255'
            : '90,110,255'
        },${
          .3-k*.03
        })`
      );

      lg.addColorStop(
        1,
        'rgba(120,100,255,0)'
      );

      x.strokeStyle =
        lg;

      x.beginPath();

      for (
        let px=0;
        px<=W*.5;
        px+=14
      ) {
        const py =
          H*.82 +
          k*11 +
          Math.sin(
            px*.006 +
            t*.0004 +
            k*.6
          )*26 -
          px*.05;

        px
          ? x.lineTo(
              px,
              py
            )
          : x.moveTo(
              px,
              py
            );
      }

      x.stroke();
    }

    const np =
      net.map(n => {
        const a =
          n.a +
          t*n.sp;

        const d =
          n.d +
          Math.sin(
            t*.0005 +
            n.ph
          ) *
          n.wob;

        return [
          cx +
          Math.cos(a) *
          d*R*1.1,

          cy +
          Math.sin(a) *
          d*R*.8
        ];
      });

    x.lineWidth =
      .8;

    for (
      let i=0;
      i<np.length;
      i++
    ) {
      for (
        let j=i+1;
        j<np.length;
        j++
      ) {
        const dx =
          np[i][0] -
          np[j][0];

        const dy =
          np[i][1] -
          np[j][1];

        const d =
          Math.hypot(
            dx,
            dy
          );

        if (
          d < R*.6
        ) {
          x.strokeStyle =
            `rgba(110,170,255,${
              .22 *
              (
                1 -
                d/(R*.6)
              )
            })`;

          x.beginPath();

          x.moveTo(
            np[i][0],
            np[i][1]
          );

          x.lineTo(
            np[j][0],
            np[j][1]
          );

          x.stroke();
        }
      }
    }

    np.forEach(
      (p,i) =>
        glow(
          p[0],
          p[1],
          6,
          i%5
            ? '120,180,255'
            : '255,140,110',
          .8
        )
    );

    x.globalCompositeOperation =
      'source-over';

    rings.forEach(
      r =>
        drawRing(
          r,
          t,
          false
        )
    );

    x.drawImage(
      halo,
      0,
      0,
      W,
      H
    );

    let g =
      x.createRadialGradient(
        cx+R*.35,
        cy-R*.4,
        R*.05,
        cx,
        cy,
        R
      );

    g.addColorStop(
      0,
      '#2a62e8'
    );

    g.addColorStop(
      .5,
      '#123a9c'
    );

    g.addColorStop(
      1,
      '#071650'
    );

    x.fillStyle = g;

    x.beginPath();

    x.arc(
      cx,
      cy,
      R,
      0,
      TAU
    );

    x.fill();

    const a =
      -1.36 +
      t*SPIN;

    x.lineWidth =
      .7;

    x.strokeStyle =
      'rgba(100,160,255,.13)';

    x.beginPath();

    for (
      let la=-60;
      la<=60;
      la+=30
    ) {
      for (
        let i=0;
        i<72;
        i++
      ) {
        const p =
          rot(
            vec(
              la,
              i*5
            ),
            a
          );

        const q =
          rot(
            vec(
              la,
              i*5+5
            ),
            a
          );

        if (
          p[2]>0 &&
          q[2]>0
        ) {
          const [
            x0,y0
          ] = P(p);

          const [
            x1,y1
          ] = P(q);

          x.moveTo(
            x0,
            y0
          );

          x.lineTo(
            x1,
            y1
          );
        }
      }
    }

    for (
      let lo=0;
      lo<360;
      lo+=30
    ) {
      for (
        let i=-17;
        i<17;
        i++
      ) {
        const p =
          rot(
            vec(
              i*5,
              lo
            ),
            a
          );

        const q =
          rot(
            vec(
              i*5+5,
              lo
            ),
            a
          );

        if (
          p[2]>0 &&
          q[2]>0
        ) {
          const [
            x0,y0
          ] = P(p);

          const [
            x1,y1
          ] = P(q);

          x.moveTo(
            x0,
            y0
          );

          x.lineTo(
            x1,
            y1
          );
        }
      }
    }

    x.stroke();

    for (
      const p of pts
    ) {
      const q =
        rot(
          p.v,
          a
        );

      if (
        q[2] <= 0
      )
        continue;

      const [
        px,py
      ] = P(q);

      const d =
        q[2];

      const lit =
        Math.max(
          .25,
          .5 +
          q[0]*.35 +
          q[1]*.25
        );

      if (
        p.land
      ) {
        x.fillStyle =
          `rgba(${
            120 +
            60*lit | 0
          },${
            200*lit +
            40 | 0
          },255,${
            Math.min(
              1,
              (.45+d*.55) *
              (lit+.3)
            )
          })`;

        const s =
          1.8+d*2;

        x.fillRect(
          px-s/2,
          py-s/2,
          s,
          s
        );

      } else {

        x.fillStyle =
          `rgba(90,140,255,${
            .02+d*.05
          })`;

        x.fillRect(
          px,
          py,
          1,
          1
        );
      }
    }

    x.globalCompositeOperation =
      'lighter';

    for (
      const p of pts
    ) {
      if (!p.city)
        continue;

      const q =
        rot(
          p.v,
          a
        );

      if (
        q[2] < .1
      )
        continue;

      const [
        px,py
      ] = P(q);

      glow(
        px,
        py,
        5+q[2]*3,
        '255,190,110',
        .55 *
        (
          .6 +
          .4 *
          Math.sin(
            t*.002 +
            p.v[0]*40
          )
        )
      );
    }

    for (
      const ar of arcs
    ) {
      const head =
        (
          t*ar.sp +
          ar.off
        ) % 1.4;

      const pl =
        ar.line.map(
          v =>
            rot(v,a)
        );

      for (
        let j=1;
        j<pl.length;
        j++
      ) {
        if (
          pl[j][2] < .02 ||
          pl[j-1][2] < .02
        )
          continue;

        const near =
          Math.max(
            0,
            1 -
            Math.abs(
              head-j/36
            )*6
          );

        x.strokeStyle =
          `rgba(${ar.col},${
            .2+near*.8
          })`;

        x.lineWidth =
          .9+near*1.5;

        const [
          x0,y0
        ] = P(
          pl[j-1]
        );

        const [
          x1,y1
        ] = P(
          pl[j]
        );

        x.beginPath();

        x.moveTo(
          x0,
          y0
        );

        x.lineTo(
          x1,
          y1
        );

        x.stroke();
      }

      const hi =
        Math.min(
          36,
          Math.floor(
            head*36
          )
        );

      if (
        head<1 &&
        pl[hi] &&
        pl[hi][2]>.02
      ) {
        const [
          hx,hy
        ] = P(
          pl[hi]
        );

        glow(
          hx,
          hy,
          15,
          ar.col,
          .95
        );
      }
    }

    nodes.forEach(
      (n,i) => {
        const q =
          rot(n,a);

        if (
          q[2]<.05
        )
          return;

        const [
          px,py
        ] = P(q);

        const ph =
          (
            t*.0007 +
            i*.3
          ) % 1;

        glow(
          px,
          py,
          12,
          '255,150,110',
          .8
        );

        x.strokeStyle =
          `rgba(255,170,130,${
            (1-ph)*.7
          })`;

        x.lineWidth =
          1;

        x.beginPath();

        x.arc(
          px,
          py,
          3+ph*16,
          0,
          TAU
        );

        x.stroke();
      }
    );

    x.globalCompositeOperation =
      'source-over';

    x.drawImage(
      rim,
      0,
      0,
      W,
      H
    );

    x.globalCompositeOperation =
      'lighter';

    rings.forEach(
      r =>
        drawRing(
          r,
          t,
          true
        )
    );

    x.globalCompositeOperation =
      'source-over';

    icons.forEach(
      ic =>
        drawIcon(
          ic,
          t
        )
    );
  }

  function resize() {
    D =
      Math.min(
        devicePixelRatio || 1,
        2
      );

    W =
      innerWidth;

    H =
      innerHeight;

    cv.width =
      W*D;

    cv.height =
      H*D;

    x.setTransform(
      D,
      0,
      0,
      D,
      0,
      0
    );

    const narrow =
      W < 760;

    R =
      Math.min(
        W,
        H
      ) *
      (
        narrow
          ? .3
          : PLANET_SIZE
      );

    cx =
      narrow
        ? W/2
        : W*PLANET_X;

    cy =
      narrow
        ? H*.38
        : H*PLANET_Y;

    build();

    if (reduce)
      frame(0);
  }

  addEventListener(
    'resize',
    resize
  );

  addEventListener(
    'pointermove',
    e => {
      tx =
        e.clientX /
          innerWidth -
        .5;

      ty =
        e.clientY /
          innerHeight -
        .5;
    }
  );

  resize();

  if (!reduce) {
    requestAnimationFrame(
      function loop(t) {
        mx +=
          (tx-mx)*.04;

        my +=
          (ty-my)*.04;

        frame(t);

        requestAnimationFrame(
          loop
        );
      }
    );
  }
})();
</script>

</body>
